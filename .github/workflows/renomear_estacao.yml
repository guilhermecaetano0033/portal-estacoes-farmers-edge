name: Renomear estação permanentemente
on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Cliente: tessaro ou fenix'
        type: choice
        options:
          - tessaro
          - fenix
        required: true
      station:
        description: 'ID numérico da estação'
        required: true
        type: string
      new_name:
        description: 'Novo nome permanente'
        required: true
        type: string
permissions:
  contents: write
jobs:
  renomear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Alterar catálogo
        env:
          CLIENT: ${{ inputs.client }}
          STATION: ${{ inputs.station }}
          NEW_NAME: ${{ inputs.new_name }}
        run: python renomear_estacao.py --client "$CLIENT" --station "$STATION" --name "$NEW_NAME"
      - name: Gravar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientes.json
          git diff --cached --quiet || (git commit -m "Renomear estação permanente [skip ci]" && git push origin HEAD:main)
      - name: Orientação
        run: echo 'Agora execute o workflow Atualizar estações e publicar portal para refletir o novo nome nas páginas.'
