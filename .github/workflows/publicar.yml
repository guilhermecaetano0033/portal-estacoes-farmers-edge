name: Atualizar estações e publicar portal
on:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Cuiaba'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atualizar.py'
      - 'clientes.json'
      - 'site/app.js'
      - 'site/style.css'
      - 'site/*.html'
      - '.github/workflows/publicar.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Coletar dados horários (até ontem)
        env:
          FARM_USER: ${{ secrets.FARM_USER }}
          FARM_PASS: ${{ secrets.FARM_PASS }}
          FARM_TOKEN: ${{ secrets.FARM_TOKEN }}
          BACKFILL_START: '2010-01-01'
          BACKFILL_MONTHS: '24'
        run: python atualizar.py
      - name: Persistir histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data/ site/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar banco horário persistente [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        name: Publicar site
        uses: actions/deploy-pages@v4
