name: Atualizar estações e publicar portal
on:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Cuiaba'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atualizar.py'
      - 'clientes.json'
      - 'site/**'
      - '.github/workflows/publicar.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Coletar dados horários (até ontem)
        env:
          FARM_USER: ${{ secrets.FARM_USER }}
          FARM_PASS: ${{ secrets.FARM_PASS }}
          FARM_TOKEN: ${{ secrets.FARM_TOKEN }}
          FARM_TOKEN_SCHEME: ${{ vars.FARM_TOKEN_SCHEME }}
          BACKFILL_START: '2026-09-01'
        run: python atualizar.py
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        name: Publicar site
        uses: actions/deploy-pages@v4
